<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valmiki Ramayana Reader</title>
  <style>
    :root {
      --bg-color: #fdfbf7;
      --card-bg: #ffffff;
      --accent-color: #8b0000;
      --sarga-header-bg: #f7f1e5;
      --kanda-header-bg: #8b0000;
      --text-color: #2c2c2c;
      --border-color: #e2d8c3;
      --highlight-bg: #ffe0b2;

      /* 5 Distinct Color Palettes for the 5 Levels */
      /* 1. Shloka (Devanagari) */
      --shloka-color: #1a1a1a;
      
      /* 2. Transliteration */
      --trans-color: #2b6cb0; /* Deep Blue */

      /* 3. Word-by-Word Translation */
      --wbw-bg: #fffaf0;
      --wbw-border: #dd6b20; /* Dark Orange/Amber */
      --wbw-title: #c05621;
      --wbw-text: #7b341e;

      /* 4. Meaning / Explanation */
      --exp-bg: #f0fff4;
      --exp-border: #38a169; /* Emerald Green */
      --exp-title: #276749;
      --exp-text: #22543d;

      /* 5. Commentary */
      --comm-bg: #faf5ff;
      --comm-border: #805ad5; /* Purple */
      --comm-title: #6b46c1;
      --comm-text: #553c9a;
    }

    body {
      font-family: 'Georgia', 'Segoe UI', serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: var(--accent-color);
      margin-bottom: 20px;
    }

    /* Search Bar */
    .search-box {
      margin-bottom: 20px;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      background-color: #fff;
      box-sizing: border-box;
    }

    .search-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 2px rgba(139, 0, 0, 0.1);
    }

    .search-stats {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 15px;
    }

    /* Tier 1: Kanda Accordion */
    .kanda-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .kanda-header {
      background-color: var(--kanda-header-bg);
      color: #ffffff;
      padding: 16px 20px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .kanda-header:hover {
      background-color: #6d0000;
    }

    .kanda-content {
      display: none;
      padding: 15px;
      background-color: #faf6f0;
    }

    /* Tier 2: Sarga Accordion */
    .sarga-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .sarga-card:last-child {
      margin-bottom: 0;
    }

    .sarga-header {
      background-color: var(--sarga-header-bg);
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.05rem;
      color: var(--accent-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .sarga-header:hover {
      background-color: #efe5d5;
    }

    .sarga-content {
      display: none;
      padding: 20px;
      border-top: 1px solid var(--border-color);
      background-color: #ffffff;
    }

    /* Shloka Container Card */
    .shloka-card {
      margin-bottom: 30px;
      padding-bottom: 25px;
      border-bottom: 1px dashed var(--border-color);
    }

    .shloka-card:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .shloka-header {
      font-size: 0.85rem;
      font-weight: bold;
      color: #777;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* -------------------------------------------------------------
       THE 5 SAME-LEVEL SECTIONS WITH DISTINCT COLORING
    ------------------------------------------------------------- */
    
    /* Level 1: Shloka (Devanagari) */
    .sec-shloka {
      font-size: 1.35rem;
      line-height: 1.8;
      color: var(--shloka-color);
      font-weight: 600;
      margin-bottom: 12px;
      white-space: pre-line;
      font-family: 'Noto Sans Devanagari', 'Sanskrit Text', Georgia, serif;
    }

    /* Level 2: Transliteration */
    .sec-transliteration {
      font-size: 1.05rem;
      font-style: italic;
      color: var(--trans-color);
      margin-bottom: 14px;
      line-height: 1.6;
      white-space: pre-line;
      font-family: 'Georgia', serif;
    }

    /* Common Base for Sections 3, 4, 5 */
    .content-box {
      padding: 12px 16px;
      border-radius: 0 6px 6px 0;
      margin-bottom: 10px;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .content-box:last-child {
      margin-bottom: 0;
    }

    .content-title {
      font-weight: bold;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 4px;
    }

    /* Level 3: Word-by-Word Translation (Amber / Orange) */
    .sec-wbw {
      background-color: var(--wbw-bg);
      border-left: 4px solid var(--wbw-border);
      color: var(--wbw-text);
    }
    .sec-wbw .content-title {
      color: var(--wbw-title);
    }

    /* Level 4: Meaning / Explanation (Green) */
    .sec-meaning {
      background-color: var(--exp-bg);
      border-left: 4px solid var(--exp-border);
      color: var(--exp-text);
    }
    .sec-meaning .content-title {
      color: var(--exp-title);
    }

    /* Level 5: Commentary (Purple) */
    .sec-commentary {
      background-color: var(--comm-bg);
      border-left: 4px solid var(--comm-border);
      color: var(--comm-text);
    }
    .sec-commentary .content-title {
      color: var(--comm-title);
    }

    mark {
      background-color: var(--highlight-bg);
      color: inherit;
      padding: 1px 3px;
      border-radius: 3px;
    }

    .arrow {
      transition: transform 0.3s ease;
      display: inline-block;
    }

    .active > .arrow {
      transform: rotate(180deg);
    }

    /* Footer Styles */
    footer {
      margin-top: 50px;
      padding: 25px 0;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 0.9rem;
      color: #666;
    }

    footer a {
      color: var(--accent-color);
      text-decoration: none;
      font-weight: 600;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .footer-dedication {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 12px;
    }

    .footer-subtext {
      margin-top: 8px;
      font-size: 0.82rem;
      color: #888;
    }

    kbd {
      background-color: #eee;
      border: 1px solid #ccc;
      border-radius: 3px;
      padding: 2px 5px;
      font-family: monospace;
      font-size: 0.8rem;
    }

    /* Floating Back to Top Button */
    .scroll-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 45px;
      height: 45px;
      background-color: var(--accent-color);
      color: #ffffff;
      border: none;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.2s ease;
      z-index: 1000;
    }

    .scroll-to-top:hover {
      background-color: #6d0000;
      transform: translateY(-3px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
    }

    .scroll-to-top.show {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>
<body>

<div class="container" id="top">
  <h1>Valmiki Ramayana</h1>

  <div class="search-box">
    <input 
      type="text" 
      id="search-input" 
      class="search-input" 
      placeholder="Search Devanagari, Transliteration, English meanings, or comments..."
    />
  </div>

  <div id="search-stats" class="search-stats"></div>
  <div id="ramayana-container">Loading Verses...</div>

  <footer>
    <div class="footer-dedication">
      🙏 Shri Krishnarpanam Asthu 🙏
    </div>
    <p>
      Dataset Source: 
      <a href="https://github.com/Ashutosh-Vijay/Valmiki_Ramayan_Dataset/tree/e1ac1f18263b9d8306f0c466f283d906d67554b3" target="_blank" rel="noopener noreferrer">
        Ashutosh-Vijay/Valmiki_Ramayan_Dataset (Commit e1ac1f1)
      </a>
    </p>
    <p class="footer-subtext">
      Press <kbd>/</kbd> to search anytime &bull; <a href="#top">Back to Top ↑</a>
    </p>
  </footer>
</div>

<!-- Floating Back to Top Button (Placed BEFORE script execution) -->
<button id="back-to-top" class="scroll-to-top" aria-label="Back to Top" title="Back to Top">
  ↑
</button>

<script>
  let kandaMap = {};

  function formatDevanagariShloka(text) {
    if (!text) return '';

    return text
      // 1. Convert double pipes/dandas (। ।, ||, ..) into standard double danda ॥
      .replace(/(?:।\s*।|\|\||\.\.)/g, '॥')

      // 2. Clean up verse numbers (e.g. "॥ 1.1.3 ॥" -> "॥1.1.3॥")
      .replace(/\s*([॥\|]{1,2})\s*([\d\.]+)\s*([॥\|]{1,2})\s*/g, ' ॥$2॥')

      // 3. Newline AFTER full verse tags (e.g., ॥1.1.3॥ or ||1.1.3||)
      .replace(/([॥\|]{1,2}[\d\.]+[॥\|]{1,2})\s*/g, '$1\n')

      // 4. Force '।' and a NEWLINE after ANY single danda/pipe (। or |)
      .replace(/\s*([।\|])\s*/g, ' ।\n')

      .split('\n')
      .map(line => line.trim())
      .join('\n')
      .trim();
  }

  async function loadRamayana() {
    try {
      const response = await fetch('../data/Valmiki_Ramayan_Shlokas.json');
      const allData = await response.json();

      // Nested Grouping: Kanda -> Sarga -> Shlokas
      kandaMap = {};
      allData.forEach(item => {
        const kName = item.kanda || 'Other Kanda';
        const sNum = item.sarga || 1;

        if (!kandaMap[kName]) kandaMap[kName] = {};
        if (!kandaMap[kName][sNum]) kandaMap[kName][sNum] = [];

        kandaMap[kName][sNum].push(item);
      });

      renderUI('');
    } catch (error) {
      console.error('Error loading JSON dataset:', error);
      document.getElementById('ramayana-container').innerText = 'Failed to load dataset. Please verify ../data/Valmiki_Ramayan_Shlokas.json path is correct.';
    }
  }

  function highlightText(text, query) {
    if (!text || !query) return text || '';
    const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    return text.replace(regex, '<mark>$1</mark>');
  }

  function renderUI(query) {
    const container = document.getElementById('ramayana-container');
    const stats = document.getElementById('search-stats');
    container.innerHTML = '';

    const cleanQuery = query.trim().toLowerCase();
    let totalMatches = 0;
    let matchingKandas = 0;

    Object.keys(kandaMap).forEach(kandaName => {
      const sargas = kandaMap[kandaName];
      let kandaMatchCount = 0;

      // Kanda Level Container
      const kandaCard = document.createElement('div');
      kandaCard.className = 'kanda-card';

      const kandaHeader = document.createElement('div');
      kandaHeader.className = 'kanda-header';

      const kandaContent = document.createElement('div');
      kandaContent.className = 'kanda-content';

      // Build Sargas inside this Kanda
      Object.keys(sargas).sort((a, b) => a - b).forEach(sargaNum => {
        const shlokas = sargas[sargaNum];

        // Filter shlokas by query
        const filteredShlokas = shlokas.filter(item => {
          if (!cleanQuery) return true;
          return (item.shloka_text && item.shloka_text.toLowerCase().includes(cleanQuery)) ||
                 (item.transliteration && item.transliteration.toLowerCase().includes(cleanQuery)) ||
                 (item.translation && item.translation.toLowerCase().includes(cleanQuery)) ||
                 (item.explanation && item.explanation.toLowerCase().includes(cleanQuery)) ||
                 (item.comments && item.comments.toLowerCase().includes(cleanQuery));
        });

        if (filteredShlokas.length === 0) return;

        kandaMatchCount += filteredShlokas.length;

        // Tier 2: Sarga Card
        const sargaCard = document.createElement('div');
        sargaCard.className = 'sarga-card';

        const sargaHeader = document.createElement('div');
        sargaHeader.className = 'sarga-header';
        sargaHeader.innerHTML = `<span>Sarga ${sargaNum} (${filteredShlokas.length} ${cleanQuery ? 'matches' : 'shlokas'})</span> <span class="arrow">▼</span>`;

        const sargaContent = document.createElement('div');
        sargaContent.className = 'sarga-content';

        // Auto-expand Sarga if searching
        if (cleanQuery) {
          sargaContent.style.display = 'block';
          sargaHeader.classList.add('active');
        }

        filteredShlokas.forEach(item => {
          const shlokaDiv = document.createElement('div');
          shlokaDiv.className = 'shloka-card';

          const formattedShlokaText = formatDevanagariShloka(item.shloka_text);
          const formattedTransliteration = formatDevanagariShloka(item.transliteration);

          // All 5 levels rendered sequentially at the same structural level
          let html = `<div class="shloka-header">Shloka ${item.shloka}</div>`;

          // Level 1: Shloka Text
          if (formattedShlokaText) {
            html += `<div class="sec-shloka">${highlightText(formattedShlokaText, cleanQuery)}</div>`;
          }

          // Level 2: Transliteration
          if (formattedTransliteration) {
            html += `<div class="sec-transliteration">${highlightText(formattedTransliteration, cleanQuery)}</div>`;
          }

          // Level 3: Word-by-Word Translation
          if (item.translation) {
            html += `<div class="content-box sec-wbw">
                      <span class="content-title">Word-by-Word Translation</span>
                      ${highlightText(item.translation, cleanQuery)}
                     </div>`;
          }

          // Level 4: Meaning / Explanation
          if (item.explanation) {
            html += `<div class="content-box sec-meaning">
                      <span class="content-title">Meaning</span>
                      ${highlightText(item.explanation, cleanQuery)}
                     </div>`;
          }

          // Level 5: Commentary
          if (item.comments) {
            html += `<div class="content-box sec-commentary">
                      <span class="content-title">Commentary</span>
                      ${highlightText(item.comments, cleanQuery)}
                     </div>`;
          }

          shlokaDiv.innerHTML = html;
          sargaContent.appendChild(shlokaDiv);
        });

        sargaHeader.addEventListener('click', (e) => {
          e.stopPropagation();
          const isOpen = sargaContent.style.display === 'block';
          sargaContent.style.display = isOpen ? 'none' : 'block';
          sargaHeader.classList.toggle('active', !isOpen);
        });

        sargaCard.appendChild(sargaHeader);
        sargaCard.appendChild(sargaContent);
        kandaContent.appendChild(sargaCard);
      });

      if (kandaMatchCount === 0) return;

      matchingKandas++;
      totalMatches += kandaMatchCount;

      kandaHeader.innerHTML = `<span>${kandaName} (${kandaMatchCount} ${cleanQuery ? 'matches' : 'shlokas'})</span> <span class="arrow">▼</span>`;

      // Auto-expand Kanda if searching
      if (cleanQuery) {
        kandaContent.style.display = 'block';
        kandaHeader.classList.add('active');
      }

      kandaHeader.addEventListener('click', () => {
        const isOpen = kandaContent.style.display === 'block';
        kandaContent.style.display = isOpen ? 'none' : 'block';
        kandaHeader.classList.toggle('active', !isOpen);
      });

      kandaCard.appendChild(kandaHeader);
      kandaCard.appendChild(kandaContent);
      container.appendChild(kandaCard);
    });

    if (cleanQuery) {
      stats.innerText = `Found ${totalMatches} matching shloka(s) across ${matchingKandas} Kanda(s).`;
    } else {
      stats.innerText = '';
    }
  }

  // Press '/' key to focus the search box instantly
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      document.getElementById('search-input').focus();
    }
  });

  // Debounced search input
  let timeout = null;
  document.getElementById('search-input').addEventListener('input', (e) => {
    clearTimeout(timeout);
    timeout = setTimeout(() => {
      renderUI(e.target.value);
    }, 200);
  });

  // Floating Back to Top Functionality
  const backToTopBtn = document.getElementById('back-to-top');

  window.addEventListener('scroll', () => {
    if (window.scrollY > 300) {
      backToTopBtn.classList.add('show');
    } else {
      backToTopBtn.classList.remove('show');
    }
  });

  backToTopBtn.addEventListener('click', () => {
    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
  });

  loadRamayana();
</script>

</body>
</html>
