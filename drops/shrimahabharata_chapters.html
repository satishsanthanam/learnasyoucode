<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToC Hierarchy - Mahabharata</title>
  <style>
    :root {
      --bg-color: #fdfbf7;
      --card-bg: #ffffff;
      --text-main: #2c2c2c;
      --accent-color: #8b0000;
      --border-color: #e2d9cc;
      --hover-bg: #f5efe6;
    }

    body {
      font-family: 'Segoe UI', -apple-system, "Noto Sans Devanagari", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 950px;
      width: 100%;
      background: var(--card-bg);
      padding: 2rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border: 1px solid var(--border-color);
    }

    h1 {
      text-align: center;
      color: var(--accent-color);
      margin-top: 0;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.8rem;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .btn-group {
      display: flex;
      gap: 6px;
    }

    .btn {
      background-color: var(--hover-bg);
      border: 1px solid var(--border-color);
      color: var(--accent-color);
      padding: 0.5rem 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-color);
      color: #fff;
    }

    .btn-sm {
      padding: 0.35rem 0.75rem;
      font-size: 0.85rem;
    }

    /* Parva Cards */
    details.parva-card {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: #faf8f5;
      padding: 0.8rem 1rem;
      margin-bottom: 1rem;
    }

    summary.parva-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--accent-color);
      cursor: pointer;
      list-style-type: none;
    }

    summary.parva-header::-webkit-details-marker {
      display: none;
    }

    summary.parva-header::before {
      content: '► ';
      font-size: 0.8rem;
      margin-right: 8px;
      transition: transform 0.2s;
    }

    details[open] > summary.parva-header::before {
      content: '▼ ';
    }

    details[open] > summary.parva-header {
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
      margin-bottom: 0.8rem;
    }

    /* Upaparva Cards */
    details.upaparva-card {
      border: 1px solid #ebd3c8;
      background: #fffaf7;
      border-radius: 6px;
      padding: 0.6rem 0.8rem;
      margin: 0.5rem 0 0.5rem 1.2rem;
    }

    summary.upaparva-header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-weight: 600;
      color: #5a2a2a;
      cursor: pointer;
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    summary.upaparva-header::-webkit-details-marker {
      display: none;
    }

    summary.upaparva-header::before {
      content: '► ';
      font-size: 0.75rem;
      margin-right: 6px;
    }

    details[open] > summary.upaparva-header::before {
      content: '▼ ';
    }

    details[open] > summary.upaparva-header {
      border-bottom: 1px solid #ebd3c8;
      padding-bottom: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .chapter-list {
      list-style-type: none;
      padding-left: 1rem;
      margin: 0.4rem 0 0 0;
    }

    .chapter-item {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 0.35rem 0;
      border-bottom: 1px dashed var(--border-color);
      font-size: 0.95rem;
    }

    /* Footer Styling */
    footer.site-footer {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>श्री महाभारत - Table of Contents</h1>

    <div class="top-bar">
      <div class="btn-group">
        <button class="btn btn-sm" onclick="toggleAllDetails(true)">📂 Expand All</button>
        <button class="btn btn-sm" onclick="toggleAllDetails(false)">📁 Collapse All</button>
      </div>
    </div>

    <!-- Read-Only Tree Container -->
    <div id="tree-container">
      <p style="text-align:center; color:#888;">Loading Table of Contents...</p>
    </div>

    <!-- Dedication Footer -->
    <footer class="doc-footer" style="margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border-color, #e2e8f0); text-align: center; color: var(--text-muted, #64748b); font-size: 0.85rem;">
            <p><strong>Gita Press Edition</strong> | <strong>🙏 Shri Krishnarpanam Asthu 🙏</strong> | <a href="https://ventpipe.blog/2026/08/02/shri-mahabharata-web-ui-version-gita-press/" target="_blank" rel="noopener noreferrer">View Blog Overview</a> </p>
    </footer>
  </div>

  <script>
    let tocData = [];

    function toggleAllDetails(open) {
      document.querySelectorAll('details').forEach(el => el.open = open);
    }

    function renderTree() {
      const container = document.getElementById('tree-container');
      container.innerHTML = '';

      if (!tocData || tocData.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:#888;">No Table of Contents data found.</p>';
        return;
      }

      tocData.forEach((parva, pIdx) => {
        const parvaEl = document.createElement('details');
        parvaEl.className = 'parva-card';
        parvaEl.open = pIdx === 0;

        parvaEl.innerHTML = `
          <summary class="parva-header">
            <span>[${pIdx + 1}. ${parva.title}]</span>
          </summary>
          <div class="upaparva-list"></div>
        `;

        const upaContainer = parvaEl.querySelector(`.upaparva-list`);

        parva.upaparvas.forEach((upa, uIdx) => {
          const upaEl = document.createElement('details');
          upaEl.className = 'upaparva-card';

          upaEl.innerHTML = `
            <summary class="upaparva-header">
              <span>(${uIdx + 1}. ${upa.title})</span>
            </summary>
            <ul class="chapter-list">
              ${upa.chapters.map(ch => `
                <li class="chapter-item">
                  <span>${ch}</span>
                </li>
              `).join('')}
            </ul>
          `;
          upaContainer.appendChild(upaEl);
        });

        container.appendChild(parvaEl);
      });
    }

    // Fetch final_toc.json dynamically from the same directory
    fetch('shrimahabharata_toc.json')
      .then(response => {
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return response.json();
      })
      .then(data => {
        tocData = data;
        renderTree();
      })
      .catch(err => {
        console.error("Could not load ToC JSON:", err);
        document.getElementById('tree-container').innerHTML = 
          '<p style="text-align:center; color:#b30000;">Error loading Table of Contents data.</p>';
      });
  </script>
</body>
</html>
